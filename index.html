<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Akkarai Herbals AI Assistant</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 35px;
    }

    .section {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
    }

    #chatBox {
      min-height: 180px;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .user {
      margin: 10px 0;
      font-weight: bold;
    }

    .bot {
      margin: 10px 0 18px;
    }

    .chat-controls {
      display: flex;
      gap: 10px;
    }

    #message {
      flex: 1;
      padding: 11px;
      font-size: 16px;
    }

    button {
      padding: 11px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      margin-top: 5px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 0 18px;
    }

    .consent-row input {
      width: auto;
      margin-top: 5px;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: darkred;
    }

    @media (max-width: 600px) {

      body {
        margin-top: 20px;
      }

      .chat-controls {
        flex-direction: column;
      }

      #message {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <h1>Akkarai Herbals</h1>

  <p class="subtitle">
    Natural herbal solutions for health and wellness.
  </p>


  <!-- AI ASSISTANT -->

  <div class="section">

    <h2>AI Assistant</h2>

    <div id="chatBox">

      <div class="bot">
        <strong>Assistant:</strong>
        Hello! I'm the Akkarai Herbals AI assistant.
        How can I help you today?
      </div>

    </div>


    <div class="chat-controls">

      <input
        id="message"
        type="text"
        maxlength="1000"
        placeholder="Ask about Akkarai Herbals..."
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>


  <!-- LEAD CAPTURE -->

  <div class="section">

    <h2>Request a Callback</h2>

    <p>
      Leave your details and enquiry if you would like
      the Akkarai Herbals team to contact you.
    </p>


    <label for="leadName">
      Name
    </label>

    <input
      id="leadName"
      type="text"
      maxlength="100"
      placeholder="Your name"
    >


    <label for="leadPhone">
      Phone number
    </label>

    <input
      id="leadPhone"
      type="tel"
      maxlength="30"
      placeholder="+971..."
    >


    <label for="leadEnquiry">
      Enquiry
    </label>

    <textarea
      id="leadEnquiry"
      maxlength="1000"
      placeholder="What would you like to know?"
    ></textarea>


    <div class="consent-row">

      <input
        id="leadConsent"
        type="checkbox"
      >

      <label for="leadConsent">
        I agree to be contacted regarding this enquiry.
      </label>

    </div>


    <button
      id="leadButton"
      onclick="submitLead()"
    >
      Submit Enquiry
    </button>


    <div
      id="leadStatus"
      class="status"
    ></div>

  </div>


  <script>

    const WORKER_URL =
      "https://akkarai-ai-backend.ameerm01012019.workers.dev";


    async function sendMessage() {

      const input =
        document.getElementById("message");

      const chatBox =
        document.getElementById("chatBox");

      const button =
        document.getElementById("sendButton");

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      appendChat(
        "You",
        message,
        "user"
      );


      input.value = "";
      button.disabled = true;


      appendChat(
        "Assistant",
        "Thinking...",
        "bot",
        "thinkingMessage"
      );


      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                action: "chat",
                message: message
              })
            }
          );


        const data =
          await response.json();


        const thinking =
          document.getElementById(
            "thinkingMessage"
          );


        if (thinking) {
          thinking.remove();
        }


        if (!response.ok) {
          throw new Error(
            data.error ||
            "Request failed"
          );
        }


        appendChat(
          "Assistant",
          data.reply,
          "bot"
        );


      } catch (error) {

        const thinking =
          document.getElementById(
            "thinkingMessage"
          );


        if (thinking) {
          thinking.remove();
        }


        appendChat(
          "Assistant",
          "Sorry, the AI assistant is temporarily unavailable.",
          "bot"
        );

      } finally {

        button.disabled = false;
        input.focus();

      }

    }


    function appendChat(
      speaker,
      text,
      className,
      id = ""
    ) {

      const chatBox =
        document.getElementById(
          "chatBox"
        );


      const div =
        document.createElement("div");


      div.className =
        className;


      if (id) {
        div.id = id;
      }


      const strong =
        document.createElement(
          "strong"
        );


      strong.textContent =
        speaker + ": ";


      div.appendChild(strong);


      div.appendChild(
        document.createTextNode(text)
      );


      chatBox.appendChild(div);


      chatBox.scrollTop =
        chatBox.scrollHeight;

    }


    async function submitLead() {

      const name =
        document
          .getElementById("leadName")
          .value
          .trim();


      const phone =
        document
          .getElementById("leadPhone")
          .value
          .trim();


      const enquiry =
        document
          .getElementById("leadEnquiry")
          .value
          .trim();


      const consent =
        document
          .getElementById("leadConsent")
          .checked;


      const status =
        document.getElementById(
          "leadStatus"
        );


      const button =
        document.getElementById(
          "leadButton"
        );


      status.textContent = "";
      status.className = "status";


      if (!name) {

        showLeadError(
          "Please enter your name."
        );

        return;

      }


      if (!phone) {

        showLeadError(
          "Please enter your phone number."
        );

        return;

      }


      if (!consent) {

        showLeadError(
          "Please confirm that you agree to be contacted."
        );

        return;

      }


      button.disabled = true;
      button.textContent =
        "Submitting...";


      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                action: "lead",

                name: name,

                phone: phone,

                enquiry: enquiry,

                consent: consent

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to save enquiry"
          );

        }


        status.textContent =
          data.message;


        status.className =
          "status success";


        document
          .getElementById("leadName")
          .value = "";


        document
          .getElementById("leadPhone")
          .value = "";


        document
          .getElementById("leadEnquiry")
          .value = "";


        document
          .getElementById("leadConsent")
          .checked = false;


      } catch (error) {

        showLeadError(
          error.message
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Submit Enquiry";

      }

    }


    function showLeadError(message) {

      const status =
        document.getElementById(
          "leadStatus"
        );


      status.textContent =
        message;


      status.className =
        "status error";

    }


    document
      .getElementById("message")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            sendMessage();
          }

        }
      );

  </script>

</body>

</html>
